name: Release

# Each app releases on its own tag, so a change to one does not ship the other.
#   remotecode-v0.2.0        -> publishes the CLI to npm
#   remotecode-server-v0.2.0 -> pushes the server image to ghcr
on:
  push:
    tags: ['remotecode-v*', 'remotecode-server-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts without publishing
        type: boolean
        default: true

jobs:
  cli:
    # A manual run builds both apps, since it never publishes anything.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'remotecode-v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # A tag that disagrees with the manifest would publish a version nobody
      # asked for, and npm would reject a version that was already published.
      - name: Verify the tag matches the manifest version
        if: github.event_name == 'push'
        run: |
          tagged="${GITHUB_REF_NAME#remotecode-v}"
          manifest=$(node -p "require('./apps/remotecode/package.json').version")
          if [ "$tagged" != "$manifest" ]; then
            echo "tag is $tagged but apps/remotecode/package.json is $manifest"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # The published CLI has no repository to read, so the deployment it talks to
      # by default is decided here. A user's config and environment still win.
      - name: Bundle the CLI
        env:
          REMOTECODE_DEFAULT_SERVER_URL: ${{ vars.REMOTECODE_DEFAULT_SERVER_URL }}
        run: pnpm --filter remotecode bundle

      # Installing the tarball outside the workspace is the only way to catch a
      # manifest that cannot actually be installed.
      - name: Verify the tarball installs and runs
        working-directory: apps/remotecode/bundle
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init -y > /dev/null
          npm i /tmp/remotecode-*.tgz
          ./node_modules/.bin/remotecode --version
          ./node_modules/.bin/remotecode --help > /dev/null

      - name: Publish to npm
        if: github.event_name == 'push'
        working-directory: apps/remotecode/bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  image:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'remotecode-server-v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag prefix is stripped so the image reads 0.2.0 rather than
      # remotecode-server-v0.2.0. The sha tag keeps manual runs taggable, since
      # metadata-action needs at least one tag to build.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=remotecode-server-v(.*),group=1
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha

      # The server ships only as an image, so this is its release artifact.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
