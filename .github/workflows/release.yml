name: Release

# One tag releases both apps, because the CLI and the server speak the same
# protocol and a version mismatch between them is the failure worth avoiding.
#   v0.2.0 -> pushes the server image to ghcr, then publishes the CLI to npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts without publishing
        type: boolean
        default: true

jobs:
  cli:
    # Runs after the image, because an npm version cannot be republished while a
    # GHCR tag can be overwritten. The reversible artifact ships first.
    needs: image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # A tag that disagrees with a manifest would publish a version nobody asked
      # for, and npm would reject a version that was already published. Both apps
      # are checked because one tag now ships both.
      - name: Verify the tag matches both manifest versions
        if: github.event_name == 'push'
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for app in tunnelcode-cli tunnelcode-server; do
            manifest=$(node -p "require('./apps/$app/package.json').version")
            if [ "$tagged" != "$manifest" ]; then
              echo "tag is $tagged but apps/$app/package.json is $manifest"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      # The published CLI has no repository to read, so the deployment it talks to
      # by default is decided here. A user's config and environment still win.
      - name: Bundle the CLI
        env:
          TUNNELCODE_DEFAULT_SERVER_URL: ${{ vars.TUNNELCODE_DEFAULT_SERVER_URL }}
        run: pnpm --filter tunnelcode bundle

      # Installing the tarball outside the workspace is the only way to catch a
      # manifest that cannot actually be installed.
      #
      # The CLI takes no options, so it is smoke-tested by opening the menu and
      # answering Exit. Stdin is a pipe here, which is the path the prompts take
      # when they cannot read keypresses.
      - name: Verify the tarball installs and runs
        working-directory: apps/tunnelcode-cli/bundle
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/verify && cd /tmp/verify
          npm init -y > /dev/null
          npm i /tmp/tunnelcode-*.tgz
          # Output goes to a file rather than into grep: grep -q exits on its
          # first match and closes the pipe, which the CLI then reports as EPIPE.
          printf '3\n' | ./node_modules/.bin/tunnelcode > /tmp/menu.txt
          grep -q Continue /tmp/menu.txt

      - name: Publish to npm
        if: github.event_name == 'push'
        working-directory: apps/tunnelcode-cli/bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag prefix is stripped so the image reads 0.2.0 rather than v0.2.0.
      # The sha tag keeps manual runs taggable, since metadata-action needs at
      # least one tag to build.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha

      # The server ships only as an image, so this is its release artifact.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
