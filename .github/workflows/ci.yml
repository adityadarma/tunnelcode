name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # better-sqlite3 compiles a native binding, so the install must be allowed
      # to run build scripts.
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm test

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Building the image is the only way to catch a broken Dockerfile before a
      # deployment does.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tunnelcode:ci

      - name: Start the container
        run: |
          docker run -d --name tunnelcode-ci -p 3000:3000 tunnelcode:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health > /dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "the server never became healthy"
          docker logs tunnelcode-ci
          exit 1

      - name: Stop the container
        if: always()
        run: docker rm -f tunnelcode-ci || true
